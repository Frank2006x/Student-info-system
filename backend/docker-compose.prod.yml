services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-api:latest
    restart: unless-stopped
    environment:
      PRIMARY_DATABASE_URL: ${PRIMARY_DATABASE_URL:?PRIMARY_DATABASE_URL is required}
      REPLICA_DATABASE_URL: ${REPLICA_DATABASE_URL:?REPLICA_DATABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"